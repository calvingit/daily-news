<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
<script>(()=>{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t})()</script>
</head><body>
<header class="site"><a class="brand" href="{{ "/" | relURL }}">☀️ {{ site.Title }}</a>
<button id="tt" aria-label="切换明暗" onclick="const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('theme',n)">◐</button></header>
<main>{{ block "main" . }}{{ end }}</main>
<footer>© {{ now.Year }} {{ site.Title }} · Built with Hugo</footer>
</body></html>
